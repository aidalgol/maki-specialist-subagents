min_maki_version = "0.7.3"

[permissions]
agent = true
fs_read = true
fs_write = true
run = true
# Held so specialists can be handed the native `webfetch`/`websearch` tools
# and the permission relay can pay their capability. The plugin itself makes
# no network calls and records no permission rules; whether web tools are
# allowed in a project is decided by its Maki permission rules and prompts.
net = true
# No chat-input API is used, and `input` is excluded from holds_all_reach, so
# denying it cannot affect delegated-reach pricing for subagent sessions.
input = false
# The permission.prompt relay layer sees each call, so it needs the session
# permissions plus the tool's own capability (run / fs_write / net, held).
# The agent.compact.before defer layer needs agent + session_read +
# session_write, all held.
session_read = true
session_write = true
# Granted solely so a `mcp = true` specialist can pay the host's hand-over
# pricing for MCP tools: on a chat with MCP servers, maki prices such a
# session at every plugin permission except `agent` and `input`. The plugin
# makes no environment reads and no session_settings API calls; the grants
# are pricing headroom, matching the `net` rationale above. Narrowing grants
# is fine; widening further is not.
env = true
session_settings = true
